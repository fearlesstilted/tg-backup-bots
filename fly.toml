# Fly.io app config — Telegram polling bot, no HTTP exposed.
# App name was auto-uniquified by `flyctl launch`; rename if you re-deploy
# under a different Fly account.

app = 'tg-backup-bots-12zo9a'
primary_region = 'fra'

[build]

[deploy]
  # Telegram allows only one polling consumer per token; never run >1 machine.
  strategy = 'immediate'

[env]
  DATABASE_PATH = '/data/bots.db'

[[mounts]]
  source = 'tg_backup_data'
  destination = '/data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
